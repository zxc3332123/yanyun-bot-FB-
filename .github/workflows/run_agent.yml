name: FB Monitor Agent

on:
  schedule:
    # 每小時跑一次 (UTC 時間)
    - cron: '0 * * * *'
  workflow_dispatch: # 允許手動執行

# 關鍵修正：必須授予寫入權限，否則 git push 會失敗
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4 # 升級至 v4

      - name: 設定 Python
        uses: actions/setup-python@v5 # 升級至 v5
        with:
          python-version: '3.9'

      - name: 安裝必要套件
        run: |
          pip install feedparser requests

      - name: 執行監控腳本
        env:
          FB_RSS_URL: ${{ secrets.FB_RSS_URL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python main.py

      - name: 儲存進度 (Git Commit)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 確保檔案存在
          touch last_link.txt 
          git add last_link.txt
          
          # 檢查是否有變動，有的話才 Commit 並 Push
          if ! git diff --staged --quiet; then
            git commit -m "chore: 更新最後讀取連結 [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
